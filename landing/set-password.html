<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set password</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-page"><section class="auth-card"><h1>Set your password</h1><p>Choose at least eight characters for your invited clinician account.</p>
<form id="passwordForm"><div class="auth-field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="auth-field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required></div><button class="auth-button">Save password</button></form>
<p id="message" class="auth-message" aria-live="polite"></p><a class="auth-link" href="forgot-password.html">Request another link</a> · <a class="auth-link" href="login.html">Back to sign in</a></section></main><script src="auth.js"></script><script>
var recovery=Auth.consumeHashSession(),passwordForm=document.getElementById("passwordForm"),initialMessage=document.getElementById("message");
if(recovery&&recovery.error){initialMessage.className="auth-message error";initialMessage.textContent="This recovery link is invalid or expired: "+recovery.error;passwordForm.querySelector("button").disabled=true;}
else if(!recovery&&!Auth.session()){initialMessage.className="auth-message error";initialMessage.textContent="Open this page from a valid invitation or password-reset link.";passwordForm.querySelector("button").disabled=true;}
passwordForm.addEventListener("submit",async function(e){e.preventDefault();var p=document.getElementById("password").value,c=document.getElementById("confirm").value,msg=document.getElementById("message"),btn=e.currentTarget.querySelector("button");
if(p!==c){msg.className="auth-message error";msg.textContent="Passwords do not match.";return;}btn.disabled=true;try{await Auth.updatePassword(p);msg.className="auth-message ok";msg.textContent="Password saved. Redirecting…";setTimeout(function(){location.replace("monitor.html");},700);}catch(err){msg.className="auth-message error";msg.textContent=err.message;btn.disabled=false;}});
</script></body></html>
