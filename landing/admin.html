<!doctype html>
<html class="protected" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinician administration</title><link rel="stylesheet" href="auth.css"><style>
.page{max-width:960px;margin:auto;padding:32px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.card{background:#fff;border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 1px 4px rgba(0,0,0,.07)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr 150px 120px;gap:12px;align-items:end}.grid .auth-field{margin:0}@media(max-width:720px){.grid{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--border);font-size:14px}select,button.small{height:36px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:0 9px}button.small{color:var(--accent);cursor:pointer}.muted{color:var(--secondary);font-size:13px}.scroll{overflow:auto}.nav a{margin-right:14px;color:var(--accent);text-decoration:none}
</style></head><body><div class="session-bar"><span id="identity"></span><a href="input.html">Intake</a><a href="monitor.html">Monitor</a><button id="logout">Sign out</button></div>
<main class="page"><div class="top"><div><h1>Administration</h1><p class="muted">Invite clinicians, control access, and assign each patient to one primary doctor.</p></div></div>
<section class="card"><h2>Invite account</h2><form class="grid" id="inviteForm"><div class="auth-field"><label for="displayName">Full name</label><input id="displayName" required></div><div class="auth-field"><label for="email">Email</label><input id="email" type="email" required></div><div class="auth-field"><label for="role">Role</label><select id="role"><option value="doctor">Doctor</option><option value="admin">Admin</option></select></div><button class="auth-button" type="submit">Send invite</button></form><p id="inviteMessage" class="auth-message"></p></section>
<section class="card"><h2>Accounts</h2><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Doctor ID</th><th>Status</th></tr></thead><tbody id="accounts"></tbody></table></div></section>
<section class="card"><h2>Patient ownership</h2><div class="scroll"><table><thead><tr><th>Patient</th><th>Email</th><th>Primary doctor</th><th></th></tr></thead><tbody id="patients"></tbody></table></div><p id="assignMessage" class="auth-message"></p></section>
</main><script src="auth.js"></script><script>
(async function(){
var profiles=[],patients=[],$=function(id){return document.getElementById(id)},esc=function(s){return String(s==null?"":s).replace(/[&<>\"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]})};
function activeDoctors(){return profiles.filter(function(p){return p.status==="active"&&p.doctor_id})}
function render(){
 $("accounts").innerHTML=profiles.map(function(p){return "<tr><td>"+esc(p.display_name)+"</td><td>"+esc(p.email)+"</td><td><select data-role=\""+esc(p.auth_user_id)+"\"><option value=\"doctor\""+(p.role==="doctor"?" selected":"")+">Doctor</option><option value=\"admin\""+(p.role==="admin"?" selected":"")+">Admin</option></select></td><td class=\"muted\">"+esc(p.doctor_id)+"</td><td><select data-status=\""+esc(p.auth_user_id)+"\"><option value=\"active\""+(p.status==="active"?" selected":"")+">Active</option><option value=\"disabled\""+(p.status==="disabled"?" selected":"")+">Disabled</option></select></td></tr>"}).join("");
 $("accounts").querySelectorAll("select").forEach(function(sel){sel.addEventListener("change",async function(){var key=sel.dataset.role?"role":"status",id=sel.dataset.role||sel.dataset.status;try{await Auth.api("/api/admin/user",{method:"PATCH",body:JSON.stringify({auth_user_id:id,[key]:sel.value})});await load();}catch(e){alert(e.message);await load();}})});
 $("patients").innerHTML=patients.map(function(p){var opts=activeDoctors().map(function(d){return "<option value=\""+esc(d.doctor_id)+"\""+(d.doctor_id===p.doctor_id?" selected":"")+">"+esc(d.display_name)+"</option>"}).join("");return "<tr><td>"+esc(p.name)+"<div class=\"muted\">"+esc(p.user_id)+"</div></td><td>"+esc(p.email)+"</td><td><select data-patient=\""+esc(p.user_id)+"\"><option value=\"\">Unassigned</option>"+opts+"</select></td><td><button class=\"small\" data-save=\""+esc(p.user_id)+"\">Save</button></td></tr>"}).join("");
 $("patients").querySelectorAll("button[data-save]").forEach(function(btn){btn.addEventListener("click",async function(){var select=$("patients").querySelector('select[data-patient="'+CSS.escape(btn.dataset.save)+'"]');if(!select.value)return;btn.disabled=true;try{await Auth.api("/api/admin/assign",{method:"POST",body:JSON.stringify({user_id:btn.dataset.save,doctor_id:select.value})});$("assignMessage").className="auth-message ok";$("assignMessage").textContent="Patient assignment saved.";await load();}catch(e){$("assignMessage").className="auth-message error";$("assignMessage").textContent=e.message;}finally{btn.disabled=false;}})});
}
async function load(){var results=await Promise.all([Auth.api("/api/admin/users"),Auth.api("/api/patients")]);profiles=results[0].profiles||[];patients=results[1].patients||[];render()}
try{var me=await Auth.guard({admin:true});$("identity").textContent=me.display_name+" · Admin";await load();}catch(_){return}
$("logout").addEventListener("click",Auth.signOut);$("inviteForm").addEventListener("submit",async function(e){e.preventDefault();var btn=e.currentTarget.querySelector("button"),msg=$("inviteMessage");btn.disabled=true;msg.textContent="Sending invitation…";try{await Auth.api("/api/admin/users",{method:"POST",body:JSON.stringify({display_name:$("displayName").value.trim(),email:$("email").value.trim(),role:$("role").value})});msg.className="auth-message ok";msg.textContent="Invitation sent.";e.currentTarget.reset();await load();}catch(err){msg.className="auth-message error";msg.textContent=err.message;}finally{btn.disabled=false;}});
})();
</script></body></html>
