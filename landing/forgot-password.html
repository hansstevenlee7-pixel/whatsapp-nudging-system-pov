<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-page"><section class="auth-card"><h1>Reset password</h1><p>We’ll email a secure password-reset link if the invited account exists.</p>
<form id="resetForm"><div class="auth-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><button class="auth-button">Send reset link</button></form>
<p id="message" class="auth-message" aria-live="polite"></p><a class="auth-link" href="login.html">Back to sign in</a>
</section></main><script src="auth.js"></script><script>
document.getElementById("resetForm").addEventListener("submit",async function(e){e.preventDefault();var msg=document.getElementById("message"),btn=e.currentTarget.querySelector("button");btn.disabled=true;msg.className="auth-message";msg.textContent="Requesting a secure link…";
try{await Auth.requestReset(document.getElementById("email").value.trim());msg.className="auth-message ok";msg.textContent="Reset link sent. Check your inbox and junk folder.";}catch(err){msg.className="auth-message error";msg.textContent=err.status===429?"The prototype email service has reached its two-email hourly limit. No email was sent. Ask an administrator for a one-time recovery link, or retry after the limit resets.":err.message;btn.disabled=false;}});
</script></body></html>
